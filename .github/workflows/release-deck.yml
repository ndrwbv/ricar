# Ручной релиз сборки для Steam Deck.
# Запуск: вкладка Actions → «Релиз для Steam Deck» → Run workflow.
# На выходе — гит-релиз с файлом knight-deck.tar.gz (linux-x64, распакованный Electron).
name: Релиз для Steam Deck

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза, например v0.1.1. Пусто — подставится дата.'
        required: false
        default: ''
      notes:
        description: 'Что нового — попадёт в описание релиза.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  deck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Зависимости
        run: npm ci

      - name: Сборка веб-части
        run: npm run build

      - name: Пакет Electron linux-x64
        run: npx electron-builder --linux dir --x64

      - name: Архив для Deck
        run: node tools/pack-deck.mjs

      - name: Выложить релиз
        env:
          GH_TOKEN: ${{ github.token }}
          IN_TAG: ${{ inputs.tag }}
          IN_NOTES: ${{ inputs.notes }}
        run: |
          set -eu
          TAG="$IN_TAG"
          if [ -z "$TAG" ]; then TAG="deck-$(date -u +%Y%m%d-%H%M)"; fi
          NOTES="$IN_NOTES"
          if [ -z "$NOTES" ]; then NOTES="Сборка для Steam Deck из ${GITHUB_SHA:0:7}."; fi
          {
            printf '%s\n\n' "$NOTES"
            printf 'Установка на Steam Deck — одна команда в Konsole (десктоп-режим):\n\n'
            printf '```bash\n'
            printf 'curl -fsSL https://raw.githubusercontent.com/%s/main/tools/install-deck.sh | bash\n' "$GITHUB_REPOSITORY"
            printf '```\n\n'
            printf 'Игра встанет в папку `knight` там, где запущена команда. Подробности — docs/DECK.md.\n'
          } > notes.md
          cp tools/install-deck.sh release/install-deck.sh
          gh release create "$TAG" release/knight-deck.tar.gz release/install-deck.sh \
            --title "Рыцарь $TAG" --notes-file notes.md --target "$GITHUB_SHA"
          echo "релиз: $TAG" >> "$GITHUB_STEP_SUMMARY"
